// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.0.21'
        kotlin_coroutines_version = '1.7.3'
        room_version = '2.6.1'
        moshi_version = '1.15.1'
        hilt_version = '2.52'
        lifecycle_version = '2.8.7'
        arch_version = '2.2.0'
        detekt_version = '1.23.7'
        fragment_version = '1.8.5'
        google_services_version = '4.4.2'
        crashlytics_version = '3.0.2'
    }
}

plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
    id 'io.gitlab.arturbosch.detekt' version "$detekt_version" apply false
    id 'com.google.gms.google-services' version "$google_services_version" apply false
    id 'com.google.firebase.crashlytics' version "$crashlytics_version" apply false
    id "com.google.devtools.ksp" version "$kotlin_version-1.0.26" apply false
    id 'com.google.dagger.hilt.android' version "$hilt_version" apply false
    id 'androidx.room' version "$room_version" apply false
}

tasks.register("clean") {
    group = "Delete"
    delete rootProject.layout.buildDirectory
}
